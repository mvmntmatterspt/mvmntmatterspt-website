[build]
  command = "npm run build"
  publish = "dist"
  ignore = "bash netlify-ignore.sh"

[dev]
  command = "npm run dev -- --host localhost"
  targetPort = 4321
  port = 8888
  framework = "#custom"

[functions]
directory = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[build.environment]
  NODE_VERSION = "22"